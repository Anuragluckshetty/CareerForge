services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careerforge
      POSTGRES_USER: careerforge
      POSTGRES_PASSWORD: careerforge_dev_only
    ports:
      - "5432:5432"
    volumes:
      - careerforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerforge -d careerforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://careerforge:careerforge_dev_only@postgres:5432/careerforge}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  careerforge-postgres:

